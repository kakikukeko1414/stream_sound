<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>loop_stream</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background-color: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-family: sans-serif;
  }

  h1 {
    font-size: 1rem;
    opacity: 0.6;
    text-align: center;
  }
</style>
</head>
<body>
  <audio id="loopSound" autoplay loop playsinline preload="auto">
    <source src="loop_stream.wav" type="audio/wav">
    お使いのブラウザはaudioタグをサポートしていません。
  </audio>

  <h1>sound is playing...</h1>

  <script>
    // iPhoneなどで自動再生がブロックされた場合、タップで再生
    document.addEventListener('click', function () {
      const audio = document.getElementById('loopSound');
      if (audio.paused) audio.play();
    });
  </script>
</body>
</html>
